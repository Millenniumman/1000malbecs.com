<script>
// ==================== HAMBURGER MENU ====================
const hamburger = document.querySelector('.hamburger');
const sidebar = document.getElementById('sidebar');

if (hamburger && sidebar) {
  hamburger.addEventListener('click', () => {
    const expanded = hamburger.getAttribute('aria-expanded') === 'true';
    hamburger.setAttribute('aria-expanded', !expanded);
    sidebar.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
      sidebar.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });
}
  </script>
  <script src="https://www.paypal.com/sdk/js?client-id=AXLHiDeAghAwl3asPmswAfodoDC_uK8nXCFaqhCt2EkEUJ9BBqu4Wr5gIJ9ebhKC3jznaAjgUOAeUlhB&currency=EUR"></script>
<script>

// ========== FUNCIÓN AUXILIAR ==========
function getCurrentShippingAndTotal() {
  const destination = document.getElementById('checkout-destination')?.value || '';
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const bottles = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
  const subtotal = cart.reduce((sum, item) => {
    const price = parseFloat(item.price) || 0;
    const qty = parseInt(item.quantity) || 1;
    return sum + (price * qty);
  }, 0);

  let shipping = 0;
  if (!isClickAndCollect && destination) {
    if (destination === 'DE') {
      shipping = bottles >= 12 ? 0 : 6.99;
    } else if (destination === 'EU') {
      shipping = 18.99;
    }
  }

  return {
    subtotal,
    shipping,
    total: subtotal + shipping,
    bottles,
    destination,
    isCollect: isClickAndCollect,
    cart
  };
}

// ========== STRIPE ==========
let stripe;
let cardElement;
let clientSecret = null;

async function createPaymentIntent() {
  const { total } = getCurrentShippingAndTotal();

  try {
    const response = await fetch('https://1000malbecs-pago.federico-augspach.workers.dev/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: Math.round(total * 100) })
    });

    const data = await response.json();

    if (data.clientSecret) {
      clientSecret = data.clientSecret;
      console.log("✅ clientSecret recibido");
      return true;
    } else {
      throw new Error(data.error || "No se recibió clientSecret");
    }
  } catch (err) {
    console.error("Error creando PaymentIntent:", err);
    alert("Error al preparar el pago: " + err.message);
    return false;
  }
}

function initializeStripe() {
  if (stripe) return;

  stripe = Stripe('pk_live_51TbKblCWcVRBeV4kr6w33DAQZhI3QPhNdAqFhQoOQNjkerMrWHvjo1OFBSzDtZS3F31rJeYIMFk0Ws3n7CoYluo2002v6GBIKs');

  const elements = stripe.elements();

  cardElement = elements.create('card', {
    style: {
      base: {
        fontSize: '16px',
        color: '#32325d',
        fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
        '::placeholder': { color: '#aab7c4' }
      }
    },
    hidePostalCode: true
  });

  cardElement.mount('#card-element');
}

async function startStripePayment() {
  const formContainer = document.getElementById('stripe-checkout-form') || document.getElementById('stripe-form-container');

  if (!formContainer) {
    alert("No se encontró el formulario de pago");
    return;
  }

  const success = await createPaymentIntent();
  if (!success) return;

  formContainer.style.display = 'block';

  if (!stripe) initializeStripe();

  const totalEl = document.getElementById('checkout-total');
  const amountSpan = document.getElementById('final-total-amount');
  if (totalEl && amountSpan) {
    amountSpan.textContent = totalEl.textContent.replace('€', '').trim();
  }

  formContainer.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function payWithStripeCard() {
  if (!clientSecret) {
    alert("El pago no está preparado. Abre el formulario nuevamente.");
    return;
  }

  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('customer-name').value.trim() || "Cliente";
  const address = document.getElementById('address').value.trim();
  const postalCode = document.getElementById('postal-code').value.trim();
  const city = document.getElementById('city').value.trim();
  const phone = document.getElementById('phone') ? document.getElementById('phone').value.trim() : '';

  if (!email || !postalCode || !city) {
    alert("Por favor completa los campos obligatorios");
    return;
  }

  const { total, shipping, destination, isCollect, cart: cartItems } = getCurrentShippingAndTotal();
  const country = isCollect ? "DE" : (destination === "DE" ? "DE" : "EU");

  try {
    const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: {
          name: name,
          email: email,
          phone: phone,
          address: {
            line1: address,
            city: city,
            postal_code: postalCode,
            country: country === "EU" ? "DE" : country
          }
        }
      }
    });

    if (error) {
      alert(error.message || "Error en el pago");
    } else {
      console.log("✅ Pago confirmado:", paymentIntent);

      const orderData = {
        orderId: "ORD-" + Date.now().toString().slice(-8),
        date: new Date().toLocaleDateString('es-ES'),
        customer: { 
          name, 
          email, 
          phone, 
          address, 
          postalCode, 
          city, 
          country: destination || (isCollect ? "Click & Collect" : "N/A")
        },
        items: cartItems,
        total: total.toFixed(2),
        shippingCost: shipping,
        deliveryMethod: isCollect ? "click_collect" : "ship",
        destination: destination || null,
        paymentMethod: "Stripe",
        status: "Pagado",
        paymentIntentId: paymentIntent.id
      };

      localStorage.setItem('lastOrder', JSON.stringify(orderData));

      try {
        await fetch('https://1000malbecs-pago.federico-augspach.workers.dev/send-order-emails', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        console.log("Emails enviados correctamente");
      } catch (e) {
        console.error("Error enviando emails:", e);
      }

      alert(`🎉 ¡Thanks ${name.split(" ")[0]}!\n\nYour order has been processed.`);

      setTimeout(() => {
        window.location.href = `/en/pedido-confirmado.html?orderId=${orderData.orderId}`;
      }, 800);
    }
  } catch (err) {
    console.error(err);
    alert("Error al confirmar el pago");
  }
}

window.startStripePayment = startStripePayment;
window.payWithStripeCard = payWithStripeCard;

// ========== WHATSAPP ==========
function payWithWhatsApp() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if (cart.length === 0) {
    alert("Your cart is empty");
    return;
  }

  const { subtotal, shipping, total, bottles, destination, isCollect } = getCurrentShippingAndTotal();

  let message = "Hola, me gustaría hacer un pedido en 1000 Malbecs:\n\n";
  cart.forEach(item => {
    const price = parseFloat(item.price) || 0;
    const qty = item.quantity || 1;
    message += `- ${qty} x ${item.name} = €${(price * qty).toFixed(2)}\n`;
  });

  message += `\nSubtotal: €${subtotal.toFixed(2)}`;

  
  if (isCollect) {
  message += `\n✅ Recoger en tienda (envío gratuito)`;
} else if (shipping === 0) {
  message += `\n✅ Envío gratuito`;
} else {
  const destText = destination === "DE" ? "Alemania" : "otros países de Europa";
  message += `\nEnvío a ${destText}: €${shipping.toFixed(2)}`;
}
message += `\n\nTotal: €${total.toFixed(2)}`;
message += `\nBotellas: ${bottles}`;
message += `\n\n¿Podemos confirmar el pedido?`;

  const url = `https://wa.me/4915158224728?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

function payWithEmail() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if (cart.length === 0) {
    alert("Tu carrito está vacío");
    return;
  }

  const { subtotal, shipping, total, bottles, destination, isCollect } = getCurrentShippingAndTotal();

  let body = "Hola equipo de 1000 Malbecs,\n\nMe gustaría realizar el siguiente pedido:\n\n";

  cart.forEach(item => {
    const price = parseFloat(item.price) || 0;
    const qty = item.quantity || 1;
    body += `- ${qty} x ${item.name} = €${(price * qty).toFixed(2)}\n`;
  });

  body += `\nSubtotal: €${subtotal.toFixed(2)}`;

  if (isCollect) {
    body += `\n✅ Recoger en tienda (envío gratuito)`;
  } else if (shipping === 0) {
    body += `\n✅ Envío gratuito`;
  } else {
    const destText = destination === "DE" ? "Alemania" : "otros países de Europa";
    body += `\nEnvío a ${destText}: €${shipping.toFixed(2)}`;
  }

  body += `\n\nTotal: €${total.toFixed(2)}`;
  body += `\nBotellas: ${bottles}`;
  body += `\n\n¡Gracias!`;

  const subject = "Pedido - " + cart.map(i => i.name).join(", ");
  const url = `mailto:ventas@1000malbecs.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = url;
}
// ========== PAYPAL ==========
function payWithPayPal() {
  const container = document.getElementById('paypal-button-container');
  if (!container) {
    alert("No se encontró el contenedor de PayPal");
    return;
  }

  container.style.display = 'block';
  container.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">Cargando PayPal...</p>';

  setTimeout(() => {
    if (typeof paypal !== 'undefined') {
      renderPayPalButton();
    } else {
      container.innerHTML = '<p style="color:red; text-align:center;">Error cargando PayPal. Recarga la página.</p>';
    }
  }, 500);
}

function renderPayPalButton() {
  const container = document.getElementById('paypal-button-container');
  if (!container) return;

  container.innerHTML = '';

  paypal.Buttons({
    style: {
      shape: 'rect',
      color: 'blue',
      layout: 'vertical',
      label: 'paypal'
    },

    createOrder: function(data, actions) {
      const { total, shipping, subtotal } = getCurrentShippingAndTotal();

      return actions.order.create({
        purchase_units: [{
          amount: {
            value: total.toFixed(2),
            currency_code: 'EUR',
            breakdown: {
              item_total: { value: subtotal.toFixed(2), currency_code: 'EUR' },
              shipping: { value: shipping.toFixed(2), currency_code: 'EUR' }
            }
          }
        }]
      });
    },

    onApprove: async function(data, actions) {
      try {
        const order = await actions.order.capture();
        console.log("✅ Pago PayPal exitoso:", order);

        const { shipping, destination, isCollect, cart } = getCurrentShippingAndTotal();

        const orderData = {
          orderId: "PP-" + order.id.slice(-8),
          date: new Date().toLocaleDateString('es-ES'),
          customer: {
            name: (order.payer?.name?.given_name || "") + " " + (order.payer?.name?.surname || "Cliente PayPal"),
            email: order.payer?.email_address || "cliente@ejemplo.com",
            phone: order.payer?.phone?.phone_number?.national_number || "No proporcionado",
            address: order.purchase_units[0]?.shipping?.address?.address_line_1 || "Dirección PayPal",
            city: order.purchase_units[0]?.shipping?.address?.admin_area_2 || "No proporcionada",
            postalCode: order.purchase_units[0]?.shipping?.address?.postal_code || "No proporcionado",
            country: order.purchase_units[0]?.shipping?.address?.country_code || "DE"
          },
          items: cart,
          total: document.getElementById('checkout-total')?.textContent || "0.00",
          shippingCost: shipping,
          deliveryMethod: isCollect ? "click_collect" : "ship",
          destination: destination || null,
          paymentMethod: "PayPal",
          status: "Pagado",
          paymentId: order.id
        };

        localStorage.setItem('lastOrder', JSON.stringify(orderData));

        try {
          const response = await fetch('https://1000malbecs-pago.federico-augspach.workers.dev/send-order-emails', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          const result = await response.json();
          console.log("Emails enviados:", result);
        } catch (e) {
          console.error("Error enviando emails:", e);
        }

        alert("¡Pago con PayPal realizado con éxito!");
        window.location.href = `/es/pedido-confirmado.html?orderId=${orderData.orderId}`;

      } catch (err) {
        console.error(err);
        alert("Error al confirmar el pago con PayPal");
      }
    },
  }).render('#paypal-button-container');
}

console.log("✅ All payment functions loaded");

<script>
document.addEventListener('DOMContentLoaded', function () {
  const optionShip = document.getElementById('option-ship');
  const optionCollect = document.getElementById('option-collect');
  const destinationSelect = document.getElementById('checkout-destination');
  const destinationSelectorBox = document.getElementById('destination-selector');
  const shippingEl = document.getElementById('checkout-shipping');
  const subtotalEl = document.getElementById('checkout-subtotal');
  const totalEl = document.getElementById('checkout-total');
  const freeHint = document.getElementById('checkout-free-hint');
  const destinationDisplay = document.getElementById('destination-display');

  let isClickAndCollect = false;
  let isCollect = false;
  function getCurrentShippingAndTotal() {
  const destination = document.getElementById('checkout-destination')?.value || '';
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const bottles = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
  const subtotal = cart.reduce((sum, item) => {
    const price = parseFloat(item.price) || 0;
    const qty = parseInt(item.quantity) || 1;
    return sum + (price * qty);
  }, 0);

  let shipping = 0;
  if (!isCollect && destination) {
    if (destination === 'DE') {
      shipping = bottles >= 12 ? 0 : 6.99;
    } else if (destination === 'EU') {
      shipping = 18.99;
    }
  }

  return {
    subtotal,
    shipping,
    total: subtotal + shipping,
    bottles,
    destination,
    isCollect: isCollect,
    cart
  };
}

  // Cargar destino guardado del carrito (si existe)
  const savedDestination = localStorage.getItem('shippingDestination') || '';
  if (destinationSelect && savedDestination) {
    destinationSelect.value = savedDestination;
  }

  function getBottleCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    return cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
  }

  function getSubtotal() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    return cart.reduce((sum, item) => {
      const price = parseFloat(item.price) || 0;
      const qty = parseInt(item.quantity) || 1;
      return sum + (price * qty);
    }, 0);
  }

  function getCurrentDestination() {
    return destinationSelect ? destinationSelect.value : '';
  }

  function calculateShipping() {
    if (isCollect) return { cost: 0 };

    const destination = getCurrentDestination();
    if (!destination) return { cost: null };

    const bottles = getBottleCount();
    if (destination === 'DE') {
      return { cost: bottles >= 12 ? 0 : 6.99 };
    }
    return { cost: 18.99 };
  }

  function updateCheckoutTotals() {
    const bottles = getBottleCount();
    const subtotal = getSubtotal();
    const destination = getCurrentDestination();
    const result = calculateShipping();

    if (subtotalEl) subtotalEl.textContent = '€' + subtotal.toFixed(2);

    if (result.cost === null) {
      shippingEl.textContent = '—';
    } else if (result.cost === 0) {
      shippingEl.textContent = 'Free';
    } else {
      shippingEl.textContent = '€' + result.cost.toFixed(2);
    }

    // Hint solo para Alemania + Ship + menos de 12
    if (freeHint) {
      if (!isCollect && destination === 'DE' && bottles < 12 && bottles > 0) {
        const remaining = 12 - bottles;
        freeHint.textContent = `Añade ${remaining} botellas má${remaining === 1 ? '' : 's'} para obtener envío sin cargo`;
        freeHint.style.display = 'block';
      } else {
        freeHint.style.display = 'none';
      }
    }

    const shippingCost = result.cost || 0;
    if (totalEl) totalEl.textContent = '€' + (subtotal + shippingCost).toFixed(2);

    const stripeAmount = document.getElementById('final-total-amount');
    if (stripeAmount) stripeAmount.textContent = (subtotal + shippingCost).toFixed(2);

    // Texto informativo
    if (destinationDisplay) {
      if (isCollect) {
        destinationDisplay.textContent = 'Retiro coordinado — Sin Cargo';
      } else if (destination === 'DE') {
        destinationDisplay.textContent = 'Envío a Alemania';
      } else if (destination === 'EU') {
        destinationDisplay.textContent = 'Envío a otros países de Europa';
      } else {
        destinationDisplay.textContent = 'Por favor selecciona el destino de la entrega';
      }
    }

    // Guardar el destino actual para que persista
    if (destination) {
      localStorage.setItem('shippingDestination', destination);
    }
  }

  function selectDelivery(collect) {
  isClickAndCollect = collect;   // ← esta línea es clave

  if (collect) {
    optionCollect.style.border = '2px solid #4A2C59';
    optionCollect.style.opacity = '1';
    optionShip.style.border = '1px solid #ddd';
    optionShip.style.opacity = '0.7';
    if (typeof destinationSelectorBox !== 'undefined' && destinationSelectorBox) {
      destinationSelectorBox.style.display = 'none';
    }
  } else {
    optionShip.style.border = '2px solid #4A2C59';
    optionShip.style.opacity = '1';
    optionCollect.style.border = '1px solid #ddd';
    optionCollect.style.opacity = '0.7';
    if (typeof destinationSelectorBox !== 'undefined' && destinationSelectorBox) {
      destinationSelectorBox.style.display = 'block';
    }
  }

  updateCheckoutTotals();
}

  // Eventos
  if (optionShip) optionShip.addEventListener('click', () => selectDelivery(false));
  if (optionCollect) optionCollect.addEventListener('click', () => selectDelivery(true));
  if (destinationSelect) destinationSelect.addEventListener('change', updateCheckoutTotals);

  // Inicial
  selectDelivery(false);
  updateCheckoutTotals();
});
</script>
