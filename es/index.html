    // Tweet carousel

                  // Recently added carousel
        function initRecentCarousel() {
            const recentCarousel = document.querySelector('.recently-added-carousel');
            if (!recentCarousel) return;
            
            const recentContainer = recentCarousel.querySelector('.recent-container');
            const recentItems = recentContainer.querySelectorAll('.recent-item');
            const itemCount = parseInt(recentContainer.getAttribute('data-item-count')) || recentItems.length;
            
            if (itemCount <= 1) {
                const recentNav = recentCarousel.querySelector('.recent-nav');
                if (recentNav) recentNav.style.display = 'none';
                return;
            }
            
            recentItems.forEach(item => {
                const cloneStart = item.cloneNode(true);
                const cloneEnd = item.cloneNode(true);
                recentContainer.insertBefore(cloneEnd, recentItems[0]);
                recentContainer.appendChild(cloneStart);
            });
            
            const totalItems = recentContainer.querySelectorAll('.recent-item').length;
            let currentRecent = itemCount;
            const itemWidthPercentage = 100 / itemCount;
            recentContainer.style.transform = `translateX(-${currentRecent * itemWidthPercentage}%)`;
            
            function moveRecent(direction) {
                currentRecent += direction;
                const newTranslateX = -currentRecent * itemWidthPercentage;
                recentContainer.style.transition = 'transform 0.5s ease';
                recentContainer.style.transform = `translateX(${newTranslateX}%)`;
                
                setTimeout(() => {
                    if (currentRecent >= itemCount * 2) {
                        currentRecent = itemCount;
                        recentContainer.style.transition = 'none';
                        recentContainer.style.transform = `translateX(-${currentRecent * itemWidthPercentage}%)`;
                    } else if (currentRecent < itemCount) {
                        currentRecent = itemCount * 2 - 1;
                        recentContainer.style.transition = 'none';
                        recentContainer.style.transform = `translateX(-${currentRecent * itemWidthPercentage}%)`;
                    }
                }, 500);
            }
            
            let autoScrollInterval = setInterval(() => moveRecent(1), 5000);
            recentCarousel.addEventListener('mouseenter', () => clearInterval(autoScrollInterval));
            recentCarousel.addEventListener('mouseleave', () => {
                autoScrollInterval = setInterval(() => moveRecent(1), 5000);
            });
            
            const prevButton = recentCarousel.querySelector('.recent-nav button:first-child');
            const nextButton = recentCarousel.querySelector('.recent-nav button:last-child');
            if (prevButton) prevButton.addEventListener('click', () => moveRecent(-1));
            if (nextButton) nextButton.addEventListener('click', () => moveRecent(1));
            
            console.log('Cantidad de vinos recientemente agregados:', itemCount);
        }
        document.addEventListener('DOMContentLoaded', initRecentCarousel);

    // Info icons for mobile
    if (window.innerWidth <= 768) {
        const infoIcons = document.querySelectorAll('.info-icon');
        infoIcons.forEach(icon => {
            ['click', 'touchstart'].forEach(eventType => {
                icon.addEventListener(eventType, (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    const overlayId = icon.getAttribute('data-overlay-id');
                    const overlay = document.querySelector(`.overlay[data-overlay-id="${overlayId}"]`);
                    const isActive = overlay.classList.contains('active');
                    document.querySelectorAll('.overlay.active').forEach(ov => { ov.classList.remove('active'); });
                    if (!isActive && overlay) { overlay.classList.add('active'); }
                }, { passive: false });
            });
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.product-card') && !e.target.closest('.info-icon')) {
                document.querySelectorAll('.overlay.active').forEach(overlay => { overlay.classList.remove('active'); });
            }
        });
    }

    // Buy buttons
    const buyButtons = document.querySelectorAll('.buy-button');
    buyButtons.forEach(button => {
        button.addEventListener('click', (e) => { e.stopPropagation(); });
    });

    // Language selector
    const languageSelector = document.querySelector('.language-selector');
    let lastScrollY = window.scrollY;
    let scrollThreshold = 50;
    if (languageSelector) {
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > scrollThreshold) {
                languageSelector.classList.add('hidden');
            } else if (currentScrollY < lastScrollY || currentScrollY <= scrollThreshold) {
                languageSelector.classList.remove('hidden');
            }
            lastScrollY = currentScrollY;
        });
        const langLinks = languageSelector.querySelectorAll('a[data-lang]');
        langLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetLang = link.getAttribute('data-lang');
                const currentPath = window.location.pathname;
                let newPath = currentPath;
                if (targetLang === 'en') { newPath = currentPath.replace(/\/(es|de)\//, '/en/'); }
                else if (targetLang === 'de') { newPath = currentPath.replace(/\/(es|en)\//, '/de/'); }
                else { newPath = currentPath.replace(/\/(en|de)\//, '/es/'); }
                if (newPath !== currentPath) { window.location.href = newPath; }
            });
        });
        const currentLang = window.location.pathname.match(/\/(es|de|en)\//)?.[1] || 'de';
        langLinks.forEach(link => {
            if (link.getAttribute('data-lang') === currentLang) { link.classList.add('active'); }
        });
    }

   // Search functionality - Versión limpia y funcional (2025)

const searchInput = document.querySelector('.search-input');
const suggestionsList = document.querySelector('.search-suggestions');

let allWines = [];

// Idioma actual
const currentLang = window.location.pathname.match(/\/(es|de|en)\//)?.[1] || 'de';

// Cargar JSON
async function loadWines() {
    try {
        const jsonPath = '/data/vinos_de.json';
        console.log('Cargando desde:', jsonPath);

        const response = await fetch(jsonPath);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status} - ${response.statusText}`);
        }

        const text = await response.text();
        console.log('Primeros 300 chars:', text.substring(0, 300));

        const data = JSON.parse(text);
        console.log('JSON parseado OK → Vinos cargados:', data.length);

        if (data.length > 0) {
            console.log('Ejemplo primer vino:', JSON.stringify(data[0], null, 2));
        }

        return data;
    } catch (error) {
        console.error('Error al cargar o parsear JSON:', error);
        return [];
    }
}

// Inicializar búsqueda
async function initSearch() {
    allWines = await loadWines();

    if (allWines.length === 0) {
        console.warn('No hay vinos disponibles → buscador vacío');
        return;
    }

    searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        suggestionsList.innerHTML = '';
        suggestionsList.style.display = 'none';

        if (query.length < 3) return;

        console.log('Buscando:', query);

        const matches = allWines
            .filter(wine => {
                const text = [
                    wine.Nombre || '',
                    wine.Bodega || '',
                    wine.Provincia || '',
                    wine.Región || '',
                    wine.Tipo || '',
                    wine.Año?.toString() || ''
                ].join(' ').toLowerCase();
                return text.includes(query);
            })
            .sort((a, b) => (a.Precio || 0) - (b.Precio || 0))
            .slice(0, 6);

        console.log('Coincidencias:', matches.length);

        if (matches.length > 0) {
            matches.forEach(wine => {
                const li = document.createElement('li');
                li.style.cssText = 'display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; border-bottom:1px solid #eee;';

                const img = document.createElement('img');
                img.src = wine.Imagen || '/images/small/placeholder.jpg';
                img.alt = wine.Nombre || 'Vino';
                img.onerror = () => img.src = '/images/small/placeholder.jpg';
                img.style.cssText = 'width:32px; height:64px; object-fit:contain; border-radius:4px; flex-shrink:0;';

                const textDiv = document.createElement('div');
                textDiv.innerHTML = `
                    <strong>${wine.Nombre || 'Sin nombre'}</strong><br>
                    <small style="color:#666;">
                        ${wine.Bodega || ''} ${wine.Año ? `(${wine.Año})` : ''}
                        ${wine.Provincia ? ` - ${wine.Provincia}` : ''}
                    </small>
                `;

                li.appendChild(img);
                li.appendChild(textDiv);
                li.dataset.url = adjustUrlForLanguage(wine.url || '#', currentLang);

                li.addEventListener('click', () => {
                    if (li.dataset.url !== '#') window.location.href = li.dataset.url;
                });

                suggestionsList.appendChild(li);
            });
            suggestionsList.style.display = 'block';
        } else {
            const li = document.createElement('li');
            li.textContent = 'No se encontraron resultados';
            li.style.padding = '12px';
            li.style.color = '#777';
            li.style.cursor = 'default';
            suggestionsList.appendChild(li);
            suggestionsList.style.display = 'block';
        }
    });

    document.addEventListener('click', e => {
        if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
            suggestionsList.style.display = 'none';
        }
    });
}

// Lanzar
document.addEventListener('DOMContentLoaded', () => {
    initSearch();
});

    // Winery grid scroll indicators
    const wineryGrid = document.querySelector('.winery-grid');
    const wineryPrev = document.querySelector('.winery-prev');
    const wineryNext = document.querySelector('.winery-next');
    function updateWineryScrollIndicators() {
        const scrollLeft = wineryGrid.scrollLeft;
        const scrollWidth = wineryGrid.scrollWidth;
        const clientWidth = wineryGrid.clientWidth;
        wineryGrid.classList.toggle('has-left', scrollLeft > 0);
        wineryGrid.classList.toggle('has-right', scrollLeft < scrollWidth - clientWidth - 1);
        if (wineryPrev && wineryNext) {
            wineryPrev.classList.toggle('hidden', scrollLeft <= 0);
            wineryNext.classList.toggle('hidden', scrollLeft >= scrollWidth - clientWidth - 1);
        }
    }
    if (wineryGrid) {
        wineryGrid.addEventListener('scroll', updateWineryScrollIndicators);
        window.addEventListener('resize', updateWineryScrollIndicators);
        updateWineryScrollIndicators();
    }
    if (wineryPrev && wineryNext) {
        wineryPrev.addEventListener('click', () => { wineryGrid.scrollBy({ left: -150, behavior: 'smooth' }); });
        wineryNext.addEventListener('click', () => { wineryGrid.scrollBy({ left: 150, behavior: 'smooth' }); });
    }

    // Function to adjust URL with current language
    function adjustUrlForLanguage(url, lang) {
        if (url.startsWith('/vinos/')) {
            return `/${lang}${url}`;
        }
        return url;
    }
