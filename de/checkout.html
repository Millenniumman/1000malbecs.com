<script>
const hamburger = document.querySelector('.hamburger');
const sidebar = document.getElementById('sidebar');

if (hamburger && sidebar) {
  hamburger.addEventListener('click', () => {
    const expanded = hamburger.getAttribute('aria-expanded') === 'true';
    hamburger.setAttribute('aria-expanded', !expanded);
    sidebar.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
      sidebar.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });
}
</script>

function trackPurchase(transactionId, value, provider) {

  const purchaseValue = Number(value);

  if (!transactionId || !Number.isFinite(purchaseValue)) {
    console.error("❌ Purchase tracking inválido", {
      transactionId,
      value,
      provider
    });
    return;
  }

  window.dataLayer = window.dataLayer || [];

  window.dataLayer.push({
    event: "purchase",
    transaction_id: String(transactionId),
    value: Number(purchaseValue.toFixed(2)),
    currency: "EUR",
    payment_provider: provider
  });

  console.log("✅ Purchase enviado a GTM", {
    transaction_id: transactionId,
    value: Number(purchaseValue.toFixed(2)),
    currency: "EUR",
    payment_provider: provider
  });
}

<script src="https://www.paypal.com/sdk/js?client-id=AXLHiDeAghAwl3asPmswAfodoDC_uK8nXCFaqhCt2EkEUJ9BBqu4Wr5gIJ9ebhKC3jznaAjgUOAeUlhB&currency=EUR"></script>
<script>
let isClickAndCollect = false;

function getCurrentShippingAndTotal() {
  const destination = document.getElementById('checkout-destination')?.value || '';
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const bottles = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
  const subtotal = cart.reduce((sum, item) => {
    const price = parseFloat(item.price) || 0;
    const qty = parseInt(item.quantity) || 1;
    return sum + (price * qty);
  }, 0);

  let shipping = 0;
  if (!isClickAndCollect && destination) {
    if (destination === 'DE') {
      shipping = bottles >= 12 ? 0 : 6.99;
    } else if (destination === 'EU') {
      shipping = 18.99;
    }
  }

  return {
    subtotal,
    shipping,
    total: subtotal + shipping,
    bottles,
    destination,
    isCollect: isClickAndCollect,
    cart
  };
}

let stripe;
let cardElement;
let clientSecret = null;

async function createPaymentIntent() {
  const { total } = getCurrentShippingAndTotal();

  try {
    const response = await fetch('https://1000malbecs-pago.federico-augspach.workers.dev/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: Math.round(total * 100) })
    });

    const data = await response.json();

    if (data.clientSecret) {
      clientSecret = data.clientSecret;
      console.log("✅ clientSecret recibido");
      return true;
    } else {
      throw new Error(data.error || "Kein clientSecret erhalten");
    }
  } catch (err) {
    console.error("Error creando PaymentIntent:", err);
    alert("Fehler bei der Zahlungsvorbereitung: " + err.message);
    return false;
  }
}

function initializeStripe() {
  if (stripe) return;

  stripe = Stripe('pk_live_51TbKblCWcVRBeV4kr6w33DAQZhI3QPhNdAqFhQoOQNjkerMrWHvjo1OFBSzDtZS3F31rJeYIMFk0Ws3n7CoYluo2002v6GBIKs');

  const elements = stripe.elements();

  cardElement = elements.create('card', {
    style: {
      base: {
        fontSize: '16px',
        color: '#32325d',
        fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
        '::placeholder': { color: '#aab7c4' }
      }
    },
    hidePostalCode: true
  });

  cardElement.mount('#card-element');
}

async function startStripePayment() {
  const formContainer = document.getElementById('stripe-checkout-form') || document.getElementById('stripe-form-container');

  if (!formContainer) {
    alert("Zahlungsformular nicht gefunden");
    return;
  }

  const success = await createPaymentIntent();
  if (!success) return;

  formContainer.style.display = 'block';

  if (!stripe) initializeStripe();

  const totalEl = document.getElementById('checkout-total');
  const amountSpan = document.getElementById('final-total-amount');
  if (totalEl && amountSpan) {
    amountSpan.textContent = totalEl.textContent.replace('€', '').trim();
  }

  formContainer.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function payWithStripeCard() {
  if (!clientSecret) {
    alert("Die Zahlung ist nicht vorbereitet. Öffnen Sie das Formular erneut.");
    return;
  }

  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('customer-name').value.trim() || "Kunde";
  const address = document.getElementById('address').value.trim();
  const postalCode = document.getElementById('postal-code').value.trim();
  const city = document.getElementById('city').value.trim();
  const phone = document.getElementById('phone') ? document.getElementById('phone').value.trim() : '';

  if (!email || !postalCode || !city) {
    alert("Bitte füllen Sie die Pflichtfelder aus");
    return;
  }

  const { total, shipping, destination, isCollect, cart: cartItems } = getCurrentShippingAndTotal();
  const country = isCollect ? "DE" : (destination === "DE" ? "DE" : "EU");

  try {
    const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: {
          name: name,
          email: email,
          phone: phone,
          address: {
            line1: address,
            city: city,
            postal_code: postalCode,
            country: country === "EU" ? "DE" : country
          }
        }
      }
    });

    if (error) {
      alert(error.message || "Fehler bei der Zahlung");
    } else {
      console.log("✅ Pago confirmado:", paymentIntent);

      const orderData = {
        orderId: "ORD-" + Date.now().toString().slice(-8),
        date: new Date().toLocaleDateString('de-DE'),
        customer: { 
          name, 
          email, 
          phone, 
          address, 
          postalCode, 
          city, 
          country: destination || (isCollect ? "Click & Collect" : "N/A")
        },
        items: cartItems,
        total: total.toFixed(2),
        shippingCost: shipping,
        deliveryMethod: isCollect ? "click_collect" : "ship",
        destination: destination || null,
        paymentMethod: "Stripe",
        status: "Bezahlt",
        paymentIntentId: paymentIntent.id
      };

      localStorage.setItem('lastOrder', JSON.stringify(orderData));
// ==================== GOOGLE TAG MANAGER ====================
// El pago ya fue confirmado antes de llegar acá.

trackPurchase(
  paymentIntent.id,
  total,
  "stripe",
  "EUR"
);
      try {
        await fetch('https://1000malbecs-pago.federico-augspach.workers.dev/send-order-emails', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        console.log("Emails enviados correctamente");
      } catch (e) {
        console.error("Error enviando emails:", e);
      }

      alert(`🎉 Danke ${name.split(" ")[0]}!\n\nIhre Bestellung wurde bearbeitet.`);

      setTimeout(() => {
        window.location.href = `/de/pedido-confirmado.html?orderId=${orderData.orderId}`;
      }, 800);
    }
  } catch (err) {
    console.error(err);
    alert("Fehler bei der Zahlungsbestätigung");
  }
}

window.startStripePayment = startStripePayment;
window.payWithStripeCard = payWithStripeCard;

function payWithWhatsApp() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if (cart.length === 0) {
    alert("Ihr Warenkorb ist leer");
    return;
  }

  const { subtotal, shipping, total, bottles, destination, isCollect } = getCurrentShippingAndTotal();

  let message = "Hallo, ich möchte bei 1000 Malbecs bestellen:\n\n";

  cart.forEach(item => {
    const price = parseFloat(item.price) || 0;
    const qty = item.quantity || 1;
    message += `- ${qty} x ${item.name} = €${(price * qty).toFixed(2)}\n`;
  });

  message += `\nZwischensumme: €${subtotal.toFixed(2)}`;

  if (isCollect) {
    message += `\n✅ Click & Collect (kostenloser Versand)`;
  } else if (shipping === 0) {
    message += `\n✅ Kostenloser Versand`;
  } else {
    const destText = destination === "DE" ? "Deutschland" : "andere EU-Länder";
    message += `\nVersand nach ${destText}: €${shipping.toFixed(2)}`;
  }

  message += `\n\nGesamt: €${total.toFixed(2)}`;
  message += `\nFlaschen: ${bottles}`;
  message += `\n\nKönnen wir die Bestellung bestätigen?`;

  const url = `https://wa.me/4915158224728?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

<script>
function renderCheckoutCart() {
  const container = document.getElementById('checkout-items');
  if (!container) {
    console.error("❌ No se encontró #checkout-items");
    return;
  }

  const cart = JSON.parse(localStorage.getItem('cart')) || [];

  if (cart.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding:50px;">Ihr Warenkorb ist leer</p>`;
    return;
  }

  let html = '';
  let subtotal = 0;
  let totalBottles = 0;

  cart.forEach(item => {
    const price = parseFloat(item.price) || 0;
    const qty = item.quantity || 1;
    const itemTotal = price * qty;
    subtotal += itemTotal;
    totalBottles += qty;

    html += `
      <div class="checkout-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="item-details">
          <h4>${item.name}</h4>
          <p>${qty} × €${price.toFixed(2)}</p>
        </div>
        <div class="item-price">
          €${itemTotal.toFixed(2)}
        </div>
      </div>`;
  });

  container.innerHTML = html;

  document.getElementById('checkout-subtotal') && 
    (document.getElementById('checkout-subtotal').textContent = `€${subtotal.toFixed(2)}`);
  
  const shippingEl = document.getElementById('checkout-shipping');
  if (shippingEl) {
    const shippingCost = totalBottles >= 12 ? 0 : 6.99;
    shippingEl.innerHTML = shippingCost === 0 
      ? `<strong style="color:#27ae60;">Kostenlos</strong>` 
      : `<strong>€${shippingCost.toFixed(2)}</strong>`;
  }

  const finalTotal = subtotal + (totalBottles >= 12 ? 0 : 6.99);
  document.getElementById('checkout-total') && 
    (document.getElementById('checkout-total').textContent = `€${finalTotal.toFixed(2)}`);
}
window.startStripePayment = startStripePayment;
window.payWithStripeCard = payWithStripeCard;
window.payWithPayPal = payWithPayPal;
window.payWithWhatsApp = payWithWhatsApp;
window.payWithEmail = payWithEmail;
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const optionShip = document.getElementById('option-ship');
  const optionCollect = document.getElementById('option-collect');
  const destinationSelect = document.getElementById('checkout-destination');
  const destinationSelectorBox = document.getElementById('destination-selector');
  const shippingEl = document.getElementById('checkout-shipping');
  const subtotalEl = document.getElementById('checkout-subtotal');
  const totalEl = document.getElementById('checkout-total');
  const freeHint = document.getElementById('checkout-free-hint');
  const destinationDisplay = document.getElementById('destination-display');

  let isClickAndCollect = false;

  const savedDestination = localStorage.getItem('shippingDestination') || '';
  if (destinationSelect && savedDestination) {
    destinationSelect.value = savedDestination;
  }

  function getBottleCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    return cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
  }

  function getSubtotal() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    return cart.reduce((sum, item) => {
      const price = parseFloat(item.price) || 0;
      const qty = parseInt(item.quantity) || 1;
      return sum + (price * qty);
    }, 0);
  }

  function getCurrentDestination() {
    return destinationSelect ? destinationSelect.value : '';
  }

  function calculateShipping() {
    if (isClickAndCollect) return { cost: 0 };

    const destination = getCurrentDestination();
    if (!destination) return { cost: null };

    const bottles = getBottleCount();
    if (destination === 'DE') {
      return { cost: bottles >= 12 ? 0 : 6.99 };
    }
    return { cost: 18.99 };
  }

  function updateCheckoutTotals() {
    const bottles = getBottleCount();
    const subtotal = getSubtotal();
    const destination = getCurrentDestination();
    const result = calculateShipping();

    if (subtotalEl) subtotalEl.textContent = '€' + subtotal.toFixed(2);

    if (result.cost === null) {
      shippingEl.textContent = '—';
    } else if (result.cost === 0) {
      shippingEl.textContent = 'Kostenlos';
    } else {
      shippingEl.textContent = '€' + result.cost.toFixed(2);
    }

    if (freeHint) {
      if (!isClickAndCollect && destination === 'DE' && bottles < 12 && bottles > 0) {
        const remaining = 12 - bottles;
        freeHint.textContent = `Noch ${remaining} Flasche${remaining === 1 ? '' : 'n'} hinzufügen und kostenlosen Versand erhalten`;
        freeHint.style.display = 'block';
      } else {
        freeHint.style.display = 'none';
      }
    }

    const shippingCost = result.cost || 0;
    if (totalEl) totalEl.textContent = '€' + (subtotal + shippingCost).toFixed(2);

    const stripeAmount = document.getElementById('final-total-amount');
    if (stripeAmount) stripeAmount.textContent = (subtotal + shippingCost).toFixed(2);

    if (destinationDisplay) {
      if (isClickAndCollect) {
        destinationDisplay.textContent = 'Abholung im Geschäft — kostenloser Versand';
      } else if (destination === 'DE') {
        destinationDisplay.textContent = 'Versand nach Deutschland';
      } else if (destination === 'EU') {
        destinationDisplay.textContent = 'Versand in andere EU-Länder';
      } else {
        destinationDisplay.textContent = 'Bitte wählen Sie ein Ziel';
      }
    }

    if (destination) {
      localStorage.setItem('shippingDestination', destination);
    }
  }

  function selectDelivery(collect) {
    isClickAndCollect = collect;

    if (collect) {
      optionCollect.style.border = '2px solid #4A2C59';
      optionCollect.style.opacity = '1';
      optionShip.style.border = '1px solid #ddd';
      optionShip.style.opacity = '0.7';
      if (destinationSelectorBox) destinationSelectorBox.style.display = 'none';
    } else {
      optionShip.style.border = '2px solid #4A2C59';
      optionShip.style.opacity = '1';
      optionCollect.style.border = '1px solid #ddd';
      optionCollect.style.opacity = '0.7';
      if (destinationSelectorBox) destinationSelectorBox.style.display = 'block';
    }

    updateCheckoutTotals();
    
    const paypalContainer = document.getElementById('paypal-button-container');
    if (paypalContainer && paypalContainer.style.display !== 'none' && paypalContainer.innerHTML.trim() !== '') {
      payWithPayPal();
    }
  }

  if (optionShip) optionShip.addEventListener('click', () => selectDelivery(false));
  if (optionCollect) optionCollect.addEventListener('click', () => selectDelivery(true));
  if (destinationSelect) destinationSelect.addEventListener('change', updateCheckoutTotals);

  selectDelivery(false);
  updateCheckoutTotals();
});
  </script>
</body>
</html>
